name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      # The package has no runtime dependencies, so a plain install was
      # omitted -- but @noble/post-quantum is an OPTIONAL one, and it is
      # the only ML-KEM backend a browser can use. Without an install step
      # the noble path cannot run here, which is why it had never been
      # executed in CI. See #42. No committed lockfile, so no npm cache.
      install-command: npm install --no-save --include=optional
      node-cache: ""
      gate-commands: |
        npm test
        npm run typecheck
        npm run examples
        npm run size

  browser:
    # A real Chromium (Playwright) against this package: a browser client -> Node host, a host living in the page driven
    # by the JS client and by the released Rust CLI, WshKeyStore across a reload (#116). Its own job so `npm test` stays
    # fast and JS-only contributors never need a browser. The Rust CLI test downloads the latest rust-v* release from this
    # repository and verifies it against the release's SHA256SUMS; GITHUB_TOKEN only lifts the API rate limit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: npm install
        run: npm install --no-save --include=optional

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run test:browser
        run: npm run test:browser
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  rust:
    # Kept as its own job, not folded into the reusable ci.yml call: it's a
    # separate Rust toolchain/build, not npm/Node-shaped, which is all the
    # reusable workflow covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      # Non-blocking: the imported workspace has pre-existing clippy
      # warnings (dead_code, too_many_arguments, etc.) that haven't been
      # triaged yet. Flip this to a hard failure once `cargo clippy
      # --workspace` is clean.
      - name: cargo clippy --workspace (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm install (for codegen:check + test:rust)
        run: npm install --no-save --include=optional

      - name: npm run codegen:check
        run: npm run codegen:check

      - name: Build wsh-server (release, for test:rust)
        run: cargo build --release -p wsh-server

      - name: npm run test:rust
        run: npm run test:rust

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
    with:
      # release-rust.yml builds GitHub Release binaries (no npm publish) and stays
      # tag-triggered on purpose; clawser pins its rust-v* tags.
      publish-workflows: ".github/workflows/publish*.yml"
