name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      # The package has no runtime dependencies, so a plain install was
      # omitted -- but @noble/post-quantum is an OPTIONAL one, and it is
      # the only ML-KEM backend a browser can use. Without an install step
      # the noble path cannot run here, which is why it had never been
      # executed in CI. See #42. No committed lockfile, so no npm cache.
      install-command: npm install --no-save --include=optional
      node-cache: ""
      gate-commands: |
        npm test
        npm run examples

  rust:
    # Kept as its own job, not folded into the reusable ci.yml call: it's a
    # separate Rust toolchain/build, not npm/Node-shaped, which is all the
    # reusable workflow covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      # Non-blocking: the imported workspace has pre-existing clippy
      # warnings (dead_code, too_many_arguments, etc.) that haven't been
      # triaged yet. Flip this to a hard failure once `cargo clippy
      # --workspace` is clean.
      - name: cargo clippy --workspace (non-blocking)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm install (for codegen:check + test:rust)
        run: npm install --no-save --include=optional

      - name: npm run codegen:check
        run: npm run codegen:check

      - name: Build wsh-server (release, for test:rust)
        run: cargo build --release -p wsh-server

      - name: npm run test:rust
        run: npm run test:rust
