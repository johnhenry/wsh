[package]
name = "wsh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for wsh (Web Shell) — SSH-like remote access over WebTransport/WebSocket"
publish = false

[[bin]]
name = "wsh"
path = "src/main.rs"

[dependencies]
wsh-core = { path = "../wsh-core" }
wsh-client = { path = "../wsh-client" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dialoguer = "0.11"
dirs = "6"
libc = "0.2"
toml = "0.8"
hex = "0.4"
portable-pty = "0.9"
# Descriptor-relative file access for `--share` (openat with O_NOFOLLOW per component). Already in
# the dependency graph (dialoguer -> tempfile -> rustix 1.x); MIT OR Apache-2.0 (LLVM exception).
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
# Paused time for the idle-bound tests of a reverse host's gateway connections (no sleeps, no wall clock).
tokio = { version = "1", features = ["full", "test-util"] }
